name: Check builder sources

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check published files
        run: python3 scripts/check-public-tree.py
      - name: Check shell and Python syntax
        run: |
          for file in build.sh scripts/*.sh; do
            /bin/sh -n "$file" || exit 1
          done
          python3 -m compileall -q scripts tools
      - name: Read the builder help
        run: /bin/sh build.sh --help
      - name: Test Steam catalog and library registration
        run: python3 scripts/test-steam-install.py
      - name: Verify architecture selection
        run: sh scripts/test-arch.sh
      - name: Test GitHub release metadata
        run: |
          xcrun clang -fobjc-arc -framework Foundation gui/ReleaseUpdate.m gui/test-release-update.m -o "$RUNNER_TEMP/test-release-update"
          "$RUNNER_TEMP/test-release-update"
      - name: Test English and Russian builder controls
        run: |
          fixture="$RUNNER_TEMP/TestBuilder.app/Contents"
          mkdir -p "$fixture/MacOS"
          cp gui/Info.plist "$fixture/Info.plist"
          xcrun clang -fobjc-arc -framework Cocoa gui/test-builder-language.m \
            gui/ReleaseUpdate.m gui/InstallUpdate.m -o "$fixture/MacOS/MaciPEAK Builder"
          "$fixture/MacOS/MaciPEAK Builder" -AppleLanguages '(en-US)' -MPExpectedLanguage en
          "$fixture/MacOS/MaciPEAK Builder" -AppleLanguages '(ru-RU)' -MPExpectedLanguage ru
      - name: Build and verify the release disk image
        run: |
          image="$RUNNER_TEMP/MaciPEAK-Builder-macOS.dmg"
          mountpoint=$(mktemp -d "$RUNNER_TEMP/builder-volume.XXXXXXXX")
          sh scripts/package-gui.sh "$image"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$image"
          trap 'hdiutil detach "$mountpoint"' EXIT
          test "$(readlink "$mountpoint/Applications")" = /Applications
          app="$mountpoint/MaciPEAK Builder.app"
          codesign --verify --deep --strict --all-architectures "$app"
          . scripts/host-tools.sh
          require_universal_macho "$app/Contents/MacOS/MaciPEAK Builder"
          test -f "$app/Contents/Resources/MaciPEAK/scripts/stage-render-scale.py"
          xcrun clang -fobjc-arc -framework Cocoa gui/InstallUpdate.m gui/test-install-update.m -o "$RUNNER_TEMP/test-install-update"
          "$RUNNER_TEMP/test-install-update" "$image" "$app" "$RUNNER_TEMP"
      - name: Store the verified builder
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MaciPEAK-Builder-macOS
          path: ${{ runner.temp }}/MaciPEAK-Builder-macOS.dmg
          if-no-files-found: error
          retention-days: 7
